name: Build unsigned IPA

# Builds Shade for real iPhones without code signing. Sideloading tools (AltStore, SideStore,
# Sideloadly, ...) re-sign the .ipa with your own Apple ID when they install it.
#
# - Every push: the .ipa is attached to the workflow run as an artifact.
# - Pushing a tag like v1.0.0, or running the workflow manually with "release" checked,
#   also publishes a GitHub Release with the .ipa (easy to download straight to an iPhone).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release with the IPA
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Make sure the Metal toolchain is installed
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Check shaders (generate + offline Metal compile)
        run: ./scripts/check-shaders.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release, iphoneos)
        run: |
          xcodebuild \
            -project Shade.xcodeproj \
            -scheme Shade \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || true
          grep -E "error:|warning: .*Shade/|BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log || true
          # A failed build can still leave a partial Shade.app behind, so check for success explicitly.
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
          test -x build/DerivedData/Build/Products/Release-iphoneos/Shade.app/Shade

      - name: Package IPA
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Shade.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Shade.ipa Payload)
          ls -lh build/Shade.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shade-ipa
          path: build/Shade.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/xcodebuild.log
            build/shader-check/*.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Shade ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: build/Shade.ipa
          body: |
            Unsigned build of Shade. Install it with AltStore, SideStore or Sideloadly (they sign it with your Apple ID).
            See the README for step-by-step instructions.
